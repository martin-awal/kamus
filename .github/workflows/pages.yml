name: Deploy to GitHub Pages

# Manual: Actions tab -> "Deploy to GitHub Pages" -> Run workflow. First enable Pages: Settings -> Pages -> Source: "GitHub Actions".
# Publishes Kamus as a static website (no Kamus server). A project site (https://USER.github.io/REPO/) gets the sub-path /REPO;
# a user site (REPO named USER.github.io) or a repository with a CNAME file (custom domain) is published at the root.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build dist/
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io || -f CNAME ]]; then BASE=""; else BASE="/$REPO"; fi
          echo "Publishing with base '$BASE'"
          BASE="$BASE" scripts/build_static.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

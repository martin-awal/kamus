name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Tests (the .apkg test is skipped here; it needs the vendored libraries)
        run: node --test tests/*.test.js

      - name: JavaScript syntax (separate scripts)
        run: for f in static/*.js; do node --check "$f"; done

      - name: Python syntax
        run: python -m compileall -q *.py scripts/*.py

      - name: credits.json is complete
        run: python scripts/check_credits.py

      - name: Nothing private is tracked
        run: |
          if git ls-files | grep -E '\.(db|pem|key|crt|apkg)$|^models/|^static/vendor/|^tts_cache/'; then
            echo "These files must stay out of git (see .gitignore)"; exit 1
          fi
          if git grep -nIE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}' -- . ':!LICENSE' ':!CODE_OF_CONDUCT.md' ':!package-lock.json' | grep -vE 'noreply|example\.(com|org)'; then
            echo "Personal email address found"; exit 1
          fi
          if git grep -nIE 'AIza[0-9A-Za-z_-]{20,}'; then
            echo "A Google API key is committed (the Firebase config belongs in the browser, not in the repo)"; exit 1
          fi

      - name: Install server dependencies
        run: pip install -r requirements.txt

      - name: Build the app shell (src/ -> static/)
        run: npm ci && npm run build

      - name: Server smoke test
        run: scripts/smoke_test.sh

  vendor:
    name: Vendored libraries can be fetched
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run scripts/fetch_vendor.sh
        run: |
          scripts/fetch_vendor.sh
          for f in ort/ort-wasm-simd-threaded.wasm transformers/transformers.min.js apkg/sql-wasm.wasm apkg/jszip.min.js firebase/firebase-app-compat.js qr/qrcode.js qr/jsQR.js; do
            test -s "static/vendor/$f" || { echo "missing static/vendor/$f"; exit 1; }
          done
      - name: Tests again, now including the .apkg export
        run: node --test tests/*.test.js

  static-site:
    name: Works as a static site (no server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: scripts/fetch_vendor.sh
      - name: Build and install the browser
        run: |
          npm ci && npm run build
          npx playwright install --with-deps chromium
      - name: Browser test against a plain file server
        run: node tests/e2e/static-site.e2e.js
      - name: Learning pages in a browser (fake microphone)
        run: node tests/e2e/learn.e2e.js
      - name: The same, built for a sub-folder (GitHub project pages)
        run: |
          BASE=/kamus scripts/build_static.sh
          mkdir -p /tmp/site/kamus && cp -R dist/. /tmp/site/kamus/
          KAMUS_E2E_DIR=/tmp/site KAMUS_BASE=/kamus node tests/e2e/static-site.e2e.js
          KAMUS_E2E_DIR=/tmp/site KAMUS_BASE=/kamus node tests/e2e/learn.e2e.js

  ui-matrix:
    name: UI matrix (layout, HCI, flows, screenshots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/fetch_vendor.sh
      - name: "Install browsers (Chromium and WebKit full suite, Firefox smoke run)"
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Restore screenshot baselines (kept out of git)
        uses: actions/cache@v4
        with:
          path: tests/ui/.snapshots
          key: ui-snapshots-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ui-snapshots-${{ github.ref_name }}-
            ui-snapshots-main-
      - name: Lint and type check
        run: npm run lint && npm run typecheck
      - name: Run the matrix
        run: npx playwright test --update-snapshots=missing
      - name: Upload report, screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-matrix
          path: |
            playwright-report
            test-results
            tests/ui/.snapshots
          retention-days: 14
